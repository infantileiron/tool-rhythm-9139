server {
    listen 80;
    charset utf-8;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /src/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
